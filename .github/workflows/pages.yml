# Builds every game and publishes them together to the gh-pages branch, which
# GitHub Pages serves: a landing page at the root, each game in its own folder.
name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['covewind/**', 'starfall/**', 'perihelion/**', 'dustline/**', 'bellbrook/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (to see which files a push changed)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Build Covewind
        working-directory: covewind
        run: npm ci && npm run check && npm run build
      - name: Build Starfall
        working-directory: starfall
        run: npm ci && npm run check && npm run build
      - name: Build Perihelion
        working-directory: perihelion
        run: npm ci && npm run check && npm run build
      # The 20 AI-only matches take a while, so they run only when the
      # sim or the AI changed (and on a manual run). `npm run check:matches` by hand.
      - name: Perihelion balance (when the sim or AI changed)
        working-directory: perihelion
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null \
            || git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- src/sim.js src/ai.js tools/check-matches.mjs | grep -q .; then
            npm run check:matches
          else
            echo "sim and AI unchanged: matches skipped"
          fi
      - name: Build Dustline
        working-directory: dustline
        run: npm ci && npm run check && npm run build
      - name: Build Bellbrook
        working-directory: bellbrook
        run: npm ci && npm run check && npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r covewind/dist _site/covewind
          cp -r starfall/dist _site/starfall
          cp -r perihelion/dist _site/perihelion
          cp -r dustline/dist _site/dustline
          cp -r bellbrook/dist _site/bellbrook
      - name: Publish to gh-pages
        working-directory: _site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish games from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
